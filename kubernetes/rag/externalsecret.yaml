apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcpsm
  namespace: rag
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: CLUSTER_NAME
          serviceAccountRef:
            name: rag-runtime
---
# Inbound API keys for the query API itself.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-api-keys
  namespace: rag
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: gcpsm
  target:
    name: rag-api-keys
    creationPolicy: Owner
  data:
    - secretKey: keys
      remoteRef:
        key: rag-api-keys
---
# Outbound key the query API uses to call the vLLM gateway.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vllm-upstream-key
  namespace: rag
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: gcpsm
  target:
    name: vllm-upstream-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: vllm-api-keys
        property: "0"   # take the first line of the keys file
---
# Pull the Qdrant API key into the rag namespace so the query API + ingestion
# can call Qdrant.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
  namespace: rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcpsm
  target:
    name: qdrant-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: qdrant-api-key
