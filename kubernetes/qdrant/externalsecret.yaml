apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcpsm
  namespace: qdrant
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: CLUSTER_NAME
          serviceAccountRef:
            name: qdrant
---
# Qdrant cluster API key — used by Qdrant server and by all clients.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
  namespace: qdrant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcpsm
  target:
    name: qdrant-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: qdrant-api-key
