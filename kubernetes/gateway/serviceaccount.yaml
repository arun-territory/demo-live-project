# Workload Identity binding: KSA → GCP SA with secretAccessor on api-keys.
# Bind once with:
#   gcloud iam service-accounts add-iam-policy-binding \
#     gateway-runtime@${PROJECT_ID}.iam.gserviceaccount.com \
#     --role=roles/iam.workloadIdentityUser \
#     --member="serviceAccount:${PROJECT_ID}.svc.id.goog[gateway/apikey-gateway]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apikey-gateway
  namespace: gateway
  annotations:
    iam.gke.io/gcp-service-account: gateway-runtime@PROJECT_ID.iam.gserviceaccount.com
