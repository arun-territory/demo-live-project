apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm
  namespace: vllm
spec:
  # Always keep at least one pod serving during voluntary disruptions
  # (node upgrades, drains). Combined with replicas>=2 in prod this prevents
  # full outages during cluster maintenance.
  minAvailable: 1
  selector:
    matchLabels:
      app: vllm
