# KSA bound to a GCP SA via Workload Identity. The corresponding GCP SA needs
# roles/secretmanager.secretAccessor on the hf-token secret. Run:
#
#   PROJECT_ID=<your-project>
#   gcloud iam service-accounts create vllm-runtime --display-name="vLLM runtime"
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:vllm-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
#     --role=roles/secretmanager.secretAccessor
#   gcloud iam service-accounts add-iam-policy-binding \
#     vllm-runtime@${PROJECT_ID}.iam.gserviceaccount.com \
#     --role=roles/iam.workloadIdentityUser \
#     --member="serviceAccount:${PROJECT_ID}.svc.id.goog[vllm/vllm]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: vllm
  annotations:
    # Replace PROJECT_ID at deploy time (see scripts/deploy.sh).
    iam.gke.io/gcp-service-account: vllm-runtime@PROJECT_ID.iam.gserviceaccount.com
