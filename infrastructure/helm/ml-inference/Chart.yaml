apiVersion: v2
name: ml-inference
description: Production-grade ML model inference platform on Kubernetes
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - machine-learning
  - inference
  - kubernetes
  - ai
home: https://github.com/arun-territory/demo-live-project
maintainers:
  - name: Platform Team
    email: platform@example.com
dependencies:
  - name: prometheus
    version: "25.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
