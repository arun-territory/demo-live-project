# Qdrant clustered vector DB.
#
# 3 replicas with Raft consensus. Pod-0 bootstraps the cluster; pods 1..N join
# via the headless service. podManagementPolicy=Parallel is safe because
# Qdrant uses Raft and the join logic in the entrypoint handles ordering.
#
# Storage: regional SSD via the standard-rwo StorageClass (GKE default).
# For multi-zone durability, swap to a regional PD storage class.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: qdrant
  labels:
    app: qdrant
spec:
  replicas: 3
  serviceName: qdrant-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      serviceAccountName: qdrant
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: cpu
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qdrant
              topologyKey: kubernetes.io/hostname
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              ORD="${HOSTNAME##*-}"
              URI="http://${HOSTNAME}.qdrant-headless.qdrant.svc.cluster.local:6335"
              BOOTSTRAP="http://qdrant-0.qdrant-headless.qdrant.svc.cluster.local:6335"
              if [ "$ORD" = "0" ]; then
                exec ./entrypoint.sh --uri "$URI"
              else
                exec ./entrypoint.sh --bootstrap "$BOOTSTRAP" --uri "$URI"
              fi
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            - name: QDRANT__LOG_LEVEL
              value: "INFO"
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
            - name: p2p
              containerPort: 6335
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: api-key
                  value: ""  # readyz is open
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
