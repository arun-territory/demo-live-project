apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: qdrant
  annotations:
    iam.gke.io/gcp-service-account: qdrant-runtime@PROJECT_ID.iam.gserviceaccount.com
---
# Used by the backup CronJob to write snapshots to GCS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-backup
  namespace: qdrant
  annotations:
    iam.gke.io/gcp-service-account: qdrant-backup@PROJECT_ID.iam.gserviceaccount.com
# Required GCP bindings:
#   gcloud iam service-accounts create qdrant-runtime
#   gcloud iam service-accounts create qdrant-backup
#
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:qdrant-runtime@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:qdrant-backup@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/storage.objectAdmin"  # scoped to the snapshots bucket
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     qdrant-runtime@PROJECT_ID.iam.gserviceaccount.com \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[qdrant/qdrant]" \
#     --role="roles/iam.workloadIdentityUser"
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     qdrant-backup@PROJECT_ID.iam.gserviceaccount.com \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[qdrant/qdrant-backup]" \
#     --role="roles/iam.workloadIdentityUser"
