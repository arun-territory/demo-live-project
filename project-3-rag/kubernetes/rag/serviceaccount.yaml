apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-runtime
  namespace: rag
  annotations:
    iam.gke.io/gcp-service-account: rag-runtime@PROJECT_ID.iam.gserviceaccount.com
---
# Ingestion needs read access to the documents bucket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-ingestion
  namespace: rag
  annotations:
    iam.gke.io/gcp-service-account: rag-ingestion@PROJECT_ID.iam.gserviceaccount.com
# Required GCP bindings:
#   gcloud iam service-accounts create rag-runtime
#   gcloud iam service-accounts create rag-ingestion
#
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:rag-runtime@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   # ingestion reads from the docs bucket (scoped — see terraform/modules/rag)
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:rag-ingestion@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     rag-runtime@PROJECT_ID.iam.gserviceaccount.com \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[rag/rag-runtime]" \
#     --role="roles/iam.workloadIdentityUser"
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     rag-ingestion@PROJECT_ID.iam.gserviceaccount.com \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[rag/rag-ingestion]" \
#     --role="roles/iam.workloadIdentityUser"
