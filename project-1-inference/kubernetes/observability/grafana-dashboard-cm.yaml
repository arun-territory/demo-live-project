# Grafana picks this up via the kube-prom-stack sidecar because of the
# `grafana_dashboard: "1"` label. The JSON below is a starter dashboard with
# the panels every interview asks about: TTFT, tokens/sec, queue depth, P50/95/99.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vllm-dashboard.json: |
    {
      "title": "vLLM Inference",
      "uid": "vllm-inference",
      "schemaVersion": 38,
      "tags": ["vllm", "llm", "inference"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Time to First Token (P50/P95/P99)",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "End-to-end Request Latency (P50/P95/P99)",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Tokens / second (generation)",
          "targets": [
            { "expr": "sum(rate(vllm:generation_tokens_total[1m])) by (pod)", "legendFormat": "{{ pod }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "type": "timeseries",
          "title": "Queue depth (num_requests_waiting)",
          "targets": [
            { "expr": "vllm:num_requests_waiting", "legendFormat": "{{ pod }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "type": "timeseries",
          "title": "Requests / second (gateway)",
          "targets": [
            { "expr": "sum(rate(apikey_gateway_requests_total[1m])) by (status)", "legendFormat": "{{ status }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "type": "timeseries",
          "title": "GPU memory used / free",
          "targets": [
            { "expr": "DCGM_FI_DEV_FB_USED", "legendFormat": "used {{ instance }}" },
            { "expr": "DCGM_FI_DEV_FB_FREE", "legendFormat": "free {{ instance }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        },
        {
          "type": "timeseries",
          "title": "GPU utilization (%)",
          "targets": [
            { "expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "{{ instance }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }
        },
        {
          "type": "timeseries",
          "title": "Running requests (in-flight)",
          "targets": [
            { "expr": "vllm:num_requests_running", "legendFormat": "{{ pod }}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }
        }
      ]
    }
