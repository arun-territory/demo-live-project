# Pulls the HuggingFace token from GCP Secret Manager and materialises it as a
# Kubernetes Secret. No static credentials in git, no service-account keys.
#
# Prereq: create the secret in Secret Manager once:
#   echo -n "hf_xxx..." | gcloud secrets create hf-token --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: vllm
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID  # replaced at deploy time
      auth:
        workloadIdentity:
          clusterLocation: REGION       # replaced at deploy time
          clusterName: CLUSTER_NAME     # replaced at deploy time
          serviceAccountRef:
            name: vllm
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: vllm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: hf-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hf-token
