apiVersion: apps/v1
kind: Deployment
metadata:
  name: apikey-gateway
  namespace: gateway
  labels:
    app: apikey-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apikey-gateway
  template:
    metadata:
      labels:
        app: apikey-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: apikey-gateway

      # System pods only — CPU pool, not GPU.
      nodeSelector:
        pool: cpu

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: apikey-gateway
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: gateway
          # Built from docker/apikey-gateway/Dockerfile; replace with your registry.
          image: REGISTRY/apikey-gateway:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100

          env:
            - name: UPSTREAM_URL
              value: "http://vllm.vllm.svc.cluster.local:8000"
            - name: API_KEYS_FILE
              value: /etc/api-keys/keys
            - name: LOG_LEVEL
              value: INFO

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: api-keys
              mountPath: /etc/api-keys
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: api-keys
          secret:
            secretName: api-keys
        - name: tmp
          emptyDir: {}
