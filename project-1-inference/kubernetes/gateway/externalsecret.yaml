apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: gateway
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: CLUSTER_NAME
          serviceAccountRef:
            name: apikey-gateway
---
# API keys live in Secret Manager as a newline-separated list.
# Create with:
#   printf "key1\nkey2\nkey3" | gcloud secrets create vllm-api-keys --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: gateway
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: api-keys
    creationPolicy: Owner
  data:
    - secretKey: keys
      remoteRef:
        key: vllm-api-keys
