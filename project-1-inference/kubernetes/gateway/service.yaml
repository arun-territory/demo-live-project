apiVersion: v1
kind: Service
metadata:
  name: apikey-gateway
  namespace: gateway
  labels:
    app: apikey-gateway
spec:
  type: ClusterIP
  selector:
    app: apikey-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
