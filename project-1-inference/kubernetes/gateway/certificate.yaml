# DNS-01 ClusterIssuer for Let's Encrypt. DNS-01 is required because the LB is
# internal — HTTP-01 needs a public reachable endpoint.
#
# Prereq: create a GCP SA with roles/dns.admin on your Cloud DNS zone, then
# create a K8s secret with the JSON key (or bind via Workload Identity — see
# cert-manager docs).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@example.com    # replace
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: PROJECT_ID
            # If using Workload Identity for cert-manager, leave serviceAccountSecretRef empty.
        selector:
          dnsZones:
            - "internal.example.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vllm-tls
  namespace: gateway
spec:
  secretName: vllm-tls
  duration: 2160h        # 90 days (LE default)
  renewBefore: 720h      # 30 days before expiry
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - llm.internal.example.com
